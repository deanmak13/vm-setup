# Sibling repos this client may ship to the builder, per gate profile. THE ONLY SOURCE of what can leave this machine
# besides the repo under test: the builder may state which it needs, and anything not listed here for that profile is
# refused (no gate). One line per entry: <profile> <repo-name> <branch>. Only that branch's tip, as just fetched from the
# sibling's origin, is shipped: never the working tree, local branches or stashes. Install beside pneuma-remote-gate as pneuma-remote-gate.siblings.conf.
# Leaves the machine for profile engine: the history of pneuma-helm-charts origin/main.
engine pneuma-helm-charts main
