# needrestart override for the GitHub Actions runner units on ci-builder.
# Installed by ci-builder-bootstrap.sh as /etc/needrestart/conf.d/50-actions-runner.conf
# and proven by tests/needrestart-actions-runner.test.sh.
#
# needrestart restarts every service whose process maps a library that apt
# just upgraded; each actions.runner.* unit's main process is `bash runsvc.sh`,
# so a libtinfo/readline/glibc patch would restart every runner mid-job.
# Never restart them from here. runner-refresh (bin/runner-refresh, every
# 5 minutes) restarts a unit that maps a replaced library once it is idle.
$nrconf{override_rc}{qr(^actions\.runner\.)} = 0;
