[Unit]
# Mandatory pre-policy. Requires= fails the docker start when the firewall unit is failed or absent;
# After= orders it. docker-user-firewall.service is RemainAfterExit, so ExecStartPre (not the unit's
# ExecStart) re-applies the policy on every docker start, including Restart=always crash restarts.
Requires=docker-user-firewall.service
After=docker-user-firewall.service

[Service]
# A failing pre-policy (non-zero exit) stops this unit from starting: dockerd never runs unfiltered.
# No leading "-" here, by design.
ExecStartPre=/usr/local/lib/pneuma-docker-fw/docker-user-firewall.sh --apply --pre-docker
# Runs after EVERY dockerd start. No leading "-": a failed post-start apply fails the docker start
# (systemd stops the unit) instead of being silently ignored, so the failure is visible.
ExecStartPost=/usr/local/lib/pneuma-docker-fw/docker-user-firewall.sh --apply
