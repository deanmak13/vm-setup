# Binaries the build host's gate sandbox needs, as DATA. One line per tool, whitespace separated:
#   name version url tarball_sha256 member_in_tarball binary_sha256 destination
# host/pneuma-gate-tools-install.sh downloads the url (https), verifies tarball_sha256 BEFORE unpacking, extracts exactly
# `member`, verifies binary_sha256, and only then installs it at `destination` (root:root 0755). Any mismatch installs nothing.
# A profile declares the tools it needs with profile_tools; the runner refuses to start a gate when one is missing.
#
# helm 3.20.0: the engine<->helm messaging cross-check runs `helm template` (offline) on the pneuma-shared-data chart.
# tarball_sha256 is the value published at https://get.helm.sh/helm-v3.20.0-linux-amd64.tar.gz.sha256sum; binary_sha256 is the
# hash of linux-amd64/helm inside it (identical to the helm v3.20.0 the dev box runs).
